<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта сбора батареек</title>
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #map { height: 100vh; width: 100vw; }
        .popup-content h3 { margin: 0 0 5px 0; color: #2e7d32; }
        .popup-content p { margin: 0; font-size: 14px; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com"></script>
    <script>
        // Инициализация карты с центром в Санкт-Петербурге [59.9343, 30.3351]
        const map = L.map('map').setView([59.9343, 30.3351], 11);

        // Подключение бесплатного слоя карты OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // База данных ваших пунктов. Сюда добавляйте новые точки!
        const points = [
            {
                name: "Экотерминал в МФЦ",
                address: "Невский пр., д. 174",
                lat: 59.9298,
                lng: 30.3805,
                info: "Принимают батарейки, ртутные лампы и градусники."
            },
            {
                name: "Контейнер у гипермаркета",
                address: "ул. Марата, д. 5",
                lat: 59.9275,
                lng: 30.3542,
                info: "Сбор любых бытовых батареек и аккумуляторов."
            }
        ];

        // Отрисовка маркеров
        points.forEach(point => {
            const marker = L.marker([point.lat, point.lng]).addTo(map);
            marker.bindPopup(`
                <div class="popup-content">
                    <h3>${point.name}</h3>
                    <p><b>Адрес:</b> ${point.address}</p>
                    <p>${point.info}</p>
                </div>
            `);
        });
    </script>
</body>
</html>
